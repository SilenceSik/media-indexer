<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>扫描</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="aurora"></div>
<div class="grain"></div>

<div class="wrap">

  <nav class="nav">
    <span class="brand"><span class="dot"></span>媒体库</span>
    <div class="nav-links">
      <a href="/">全部</a>
      <a href="/?has_magnet=1">有磁力</a>
      <a href="/?missing_meta=1">缺元数据</a>
      <a href="/scan" class="on">扫描</a>
    </div>
    <form class="search" action="/search" method="get">
      <input name="q" placeholder="搜索番号" autocomplete="off">
      <button type="submit">搜索</button>
    </form>
  </nav>

  <header class="hero" style="grid-template-columns:1fr; margin-bottom:3rem">
    <div>
      <h1>扫描目录</h1>
      <p>指定一个目录，识别其中的番号并落库。格式白名单与目录排除照旧生效。</p>
    </div>
  </header>

  <div class="shell" style="max-width:760px">
    <div class="card" style="padding:1.75rem">

      <label class="field">
        <span>目录路径</span>
        <input id="path" placeholder="例如 X:\迅雷下载" autocomplete="off" spellcheck="false">
      </label>

      {% if scan_paths %}
      <div class="chips">
        <span class="chips-label">config.yaml 里配的</span>
        {% for p in scan_paths %}
        <button class="chip" type="button" onclick="document.getElementById('path').value='{{ p }}'">{{ p }}</button>
        {% endfor %}
      </div>
      {% endif %}

      <label class="check">
        <input type="checkbox" id="dry">
        <span>只预览不落库（dry-run）</span>
      </label>

      <div class="actions">
        <button class="primary" id="go" onclick="start(false)">
          <span>开始扫描</span>
          <span class="arrow">→</span>
        </button>
        <button class="primary" id="go-fetch" onclick="start(true)">
          <span>扫描并抓取磁力</span>
          <span class="arrow">→</span>
        </button>
        <span class="hint" id="hint"></span>
      </div>

      <p class="note">
        「扫描并抓取磁力」会在扫描完成后，对识别出的番号依次抓取
        <strong>元数据 / 磁力 / 封面 / 内容截图</strong>。
        抓取会联网访问 JavDB，每条约 3-6 秒；不做自动抓取，只在你点按钮时执行。
      </p>

    </div>
  </div>

  <div id="progress-box" style="display:none; margin-top:2rem; max-width:760px">
    <div class="shell">
      <div class="card" style="padding:1.75rem">

        <div class="prog-head">
          <span class="mono" id="prog-path"></span>
          <span class="mono" id="prog-count"></span>
        </div>

        <div class="bar"><div class="fill" id="bar"></div></div>

        <div class="prog-stats" id="prog-stats"></div>

        <div class="results" id="results"></div>

      </div>
    </div>
  </div>

</div>

<script>
var timer = null;

function start(enrich) {
  var path = document.getElementById('path').value.trim();
  var dry = document.getElementById('dry').checked;
  var hint = document.getElementById('hint');

  if (!path) { hint.textContent = '先填目录'; return; }

  if (enrich && !confirm('扫描后会对识别出的番号抓取元数据/磁力/封面/截图。\n\n会联网访问 JavDB，每条约 3-6 秒。继续？')) {
    return;
  }

  if (enrich && dry) {
    hint.textContent = 'dry-run 模式不会抓取（不落库就没法抓）';
    return;
  }

  hint.textContent = '';
  fetch('/api/scan/start', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path: path, dry_run: dry, enrich: enrich })
  })
  .then(function (r) { return r.json().then(function (j) { return { s: r.status, j: j }; }); })
  .then(function (res) {
    if (!res.j.ok) { hint.textContent = res.j.error || '启动失败'; return; }
    document.getElementById('progress-box').style.display = 'block';
    document.getElementById('go').disabled = true;
    document.getElementById('go-fetch').disabled = true;
    poll();
  })
  .catch(function (e) { hint.textContent = '请求失败: ' + e; });
}

function poll() {
  fetch('/api/scan/status')
    .then(function (r) { return r.json(); })
    .then(function (job) {
      render(job);
      if (job.running) {
        timer = setTimeout(poll, 400);
      } else {
        document.getElementById('go').disabled = false;
        if (timer) { clearTimeout(timer); timer = null; }
      }
    });
}

function render(job) {
  document.getElementById('prog-path').textContent = job.path || '';

  var enriching = job.phase === 'enrich';
  var done = enriching ? job.enrich_done : job.done;
  var total = enriching ? job.enrich_total : job.total;

  document.getElementById('prog-count').textContent =
    total ? (done + ' / ' + total) : (job.done + ' 个文件');

  var pct = total ? Math.round(done / total * 100) : (job.running ? 12 : 100);
  document.getElementById('bar').style.width = Math.min(100, pct) + '%';

  var stats = [];
  if (enriching) { stats.push('抓取素材'); }
  stats.push('落库 ' + job.saved);
  if (job.dry_run) { stats.push('dry-run 模式'); }
  if (job.unrecognized && job.unrecognized.length) {
    stats.push('未识别 ' + job.unrecognized.length);
  }
  if (job.error) { stats.push('错误: ' + job.error); }
  document.getElementById('prog-stats').textContent = stats.join('  ·  ');

  var box = document.getElementById('results');
  var html = '';
  for (var i = job.files.length - 1; i >= 0 && i > job.files.length - 61; i--) {
    var f = job.files[i];
    var nums = f.numbers.length
      ? f.numbers.map(function (n) {
          var extra = '';
          if (n.magnet_count) { extra = '<i>+' + n.magnet_count + '磁力</i>'; }
          else if (n.enriched) { extra = '<i>✓</i>'; }
          return '<span class="tag">' + n.number + '<i>' + n.confidence + '</i>' + extra + '</span>';
        }).join('')
      : '<span class="tag miss">未识别</span>';
    html += '<div class="row">'
          + '<span class="fn">' + esc(f.file) + '</span>'
          + '<span class="nums">' + nums + '</span>'
          + '</div>';
  }
  box.innerHTML = html;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
</script>

</body>
</html>
