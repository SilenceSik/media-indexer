# ══════════════════════════════════════════════════════════════
# 扫描范围
# ══════════════════════════════════════════════════════════════
#
# 分三档（2026-09-24 主人定）：
#
#   skip    不扫
#   known   只扫 known_paths 里列的**已知 AV 路径**（保护慢盘/病盘）
#   full    整盘扫
#
# 为什么需要 known 这一档：E: 与 F: 是**同一块物理盘**
# （TOSHIBA HDWD130，WMI 报 Warning / Predictive Failure）。
# 全盘遍历要读大量目录项，对这块盘是额外负担。而 AV 只集中在几个已知
# 目录里（从 26,230 条快照统计得出），扫这几个就够。
#
# ⚠️ 只有列在 scan_scope 里的盘才参与扫描 —— 没列的盘**不会被扫**
#    （安全默认：C 盘系统盘不在列表里，就不会被碰）。
scan_scope:
  C: "skip"       # 系统盘，不扫
  D: "full"       # 开发盘（语料少，但扫了才知道）
  E: "known"      # 病盘，只扫已知 AV 路径
  F: "known"      # 病盘，同上
  G: "full"
  H: "full"
  M: "full"       # NVMe 备份盘

# `known` 档的盘扫这些目录（大小写不敏感）。
#
# 依据：26,230 条快照按顶层目录统计命中数 ——
#   X:\downloads   163 命中 / 4001 文件
#   X:\downloads   138 命中 / 1547 文件
#   X:\media         113 命中 /  761 文件
#   X:\下载        38 命中 /  855 文件
#   X:\Down         3 命中 /  111 文件
#   X:\迅雷云盘     1 命中 /   62 文件
known_paths:
  - "X:\\downloads"
  - "X:\\dl-other"
  - "X:\\cloud"
  - "X:\\downloads"
  - "X:\\media"
  - "X:\\dl-other"

# 兼容保留：不传路径、也没有 scan_scope 时用这个。
# 现在走 scan_scope，这项只在旧配置里还有意义。
scan_paths:
  - "X:\\"

# AV 匹配格式白名单 —— **追加**语义，不是覆盖。
#
# 程序自带一套标准视频格式（core/scanner_v2.DEFAULT_VIDEO_EXTENSIONS）：
#   .mp4 .mkv .avi .mov .wmv .flv .mpg .mpeg .m4v .ts .m2ts
# 这里写的是「我还想额外收哪些格式」，会被**叠加**到上面那套之上。
#
# 实测依据（26,230 条真实语料）：
#   - 可信档（confidence >= 90）命中 223 个文件，全部落在
#     .mp4 / .mkv / .wmv / .avi，其余格式可信产出为 0
#   - .webm 有 15,593 个（占语料 59.4%），可信产出 0.00%，
#     低分档假阳性几乎全是 .webm 片段（录屏 / OF / 3D 动画）
#     所以它不在默认里 —— 真有个别番号是 .webm 时再往下加
#   - .rmvb / .rm 同为 0 产出，同样不默认收录
#
# 追加示例（取消注释即可生效，无需改代码）：
video_extensions: []
#  - ".webm"
#  - ".rmvb"
#  - ".rm"

# JavBus 兜底（本机自托管 API，见 skill devops/javbus-api-ops）
#
# 主源（javdb）查不到的番号，是否再试一次 JavBus。
#   off    -> 不用（默认）
#   auto   -> 用，且**按需启停**服务（平时不跑，批量抓取前起、跑完杀）
#
# 默认 off 的理由：兜底会改变「查得到」的口径（JavBus 收录范围与 JavDB
# 不同），等于悄悄放宽了 D8「查不到不入库」这条闸门 —— 该由主人显式打开。
#
# 注意：JavBus 不提供评论数，靠它收录的番号拿不到「极高」档（安全方向）。
#
# ⚠️ 取值加引号。YAML 1.1 会把裸写的 off / on / yes / no 解析成布尔，
#    写 `fallback: off` 拿到的是 False 而不是字符串 —— 代码两种都认，
#    但加引号更不容易让人误读。
fallback: "off"

# 批量抓取的并发度。
#
# 实测（2026-09-24，隔离登录态）：
#   并发 6   18 个番号   9.6s   4.4x   失败 0
#   并发 12  30 个番号   6.5s  10.8x   失败 1（番号本身不存在，非限流）
#   单条中位耗时 2.13s，与串行一致 —— 无排队、无限流迹象
#
# 为什么默认 6 而不是 12：12 在**短时间小批量**下没问题，但批量抓几百个时
# 长时间高频更容易触发风控。6 的 4.4x 已经够用，留余量给「更快失败要能刹住」。
#
# 并发是安全的，前提是**隔离登录态**（磁力查询不需要登录）：
# 代码会把子进程的 HOME 指到 storage/javdb_anon_home（那里没有 auth.json），
# 所以既不会并发写坏 token，也没有账号可被风控。
enrich_workers: 6

# 不参与 AV 匹配的目录 —— **追加**语义，不是覆盖。
#
# 程序自带一套内置排除目录（core.scanner_v2.DEFAULT_EXCLUDED_DIR_SEGMENTS）：
#   ga game www animations __pycache__ node_modules
# 这里写的是「我还想额外排除哪些目录名」，会被**叠加**到上面那套之上。
#
# 依据（26,230 条真实语料实测）：
#   - X:\ga\ / X:\ga\（成人游戏资源树）占语料 71.6%，贡献 268 条解析
#     命中，但可信档产出 0 —— 全部是游戏内视频段与引擎缓存名
#   - 全语料中带 game / www 目录段的文件，可信产出同样是 0
#   - 可信档 223 条中，无一路径包含 game / www / ga 段
#
# 匹配的是路径「任意一段」（不区分大小写），不是子串包含：
#   "X:\ga\..."       -> 排除
#   "X:\Movie\game\"  -> 排除
#   "X:\Gaunt\x.mp4"  -> 保留（段名不等，子串相同不算）
excluded_dir_segments: []
#  - "tencent files"
#  - "backup"

# 种子保存目录：卡片上的「种子」按钮把该番号的磁力写成文本档放这里。
# 磁力本身只是 hash，存成文件是留底（丢了得重找）。**追加**语义，
# 程序默认用 storage/torrents。
torrent_dir: "storage/torrents"

# v2 主库（唯一主线，）
database: "storage/library_v2.db"

# v1 库，已冻结为只读迁移源，仅供 migration_v1_to_v2.py 使用
database_v1_legacy: "storage/library.db"

# 扫描增量索引库（file_index 表，由 core.file_index.FileIndex 独立建库）
index_db: "storage/file_index_v2.db"

dictionary: "data/dictionary.json"

image_storage:
  covers: "storage/images/covers"
  screenshots: "storage/images/screenshots"

library_path: "X:\\MediaLibrary"

organize:
  library_path: "X:\\MediaLibrary"
  folder_template: "{number}"
  filename_template: "{number}{ext}"
  mode: "move"
  keep_original: false
